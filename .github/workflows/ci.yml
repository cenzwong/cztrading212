name: CI
on:
  push:
  pull_request:
env:
  TRADING212_RUN_DEMO_READS: "0"
  TRADING212_RUN_DEMO_WRITES: "0"
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --python ${{ matrix.python }} --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest
      - run: python scripts/generate.py && git diff --exit-code -- openapi/normalized.json src/cztrading212/_generated && test -z "$(git ls-files --others --exclude-standard -- openapi/normalized.json src/cztrading212/_generated)"
      - run: uv build
  install-extras:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        install: [core, cli, mcp]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install selected dependencies
        shell: bash
        run: |
          case '${{ matrix.install }}' in
            core) uv sync --locked --no-dev ;;
            cli) uv sync --locked --no-dev --extra cli ;;
            mcp) uv sync --locked --no-dev --extra mcp ;;
          esac
      - name: Verify independent installation
        shell: bash
        run: |
          case '${{ matrix.install }}' in
            core) uv run --no-sync python -c "import cztrading212, importlib.util; assert importlib.util.find_spec('pydantic') is None" ;;
            cli) uv run --no-sync cz212 --help && uv run --no-sync python -c "import importlib.util; assert importlib.util.find_spec('pydantic') is None; assert importlib.util.find_spec('mcp') is None" ;;
            mcp) uv run --no-sync python -c "from cztrading212.mcp.server import build_server; import importlib.util; build_server(); assert importlib.util.find_spec('typer') is None" ;;
          esac
