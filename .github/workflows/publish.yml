name: Validate and publish Python distributions
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag on main (for example v0.1.0a1)
        required: true
        type: string
      publish:
        description: Publish after verification and protected-environment approval
        required: true
        type: boolean
        default: false
permissions:
  contents: read
env:
  TRADING212_RUN_DEMO_READS: '0'
  TRADING212_RUN_DEMO_WRITES: '0'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --all-extras
      - name: Check tag and tracked paths
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: uv run python scripts/check_release.py --tag "$RELEASE_TAG" --source-only
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest
      - run: python scripts/generate.py && git diff --exit-code -- openapi/normalized.json src/cztrading212/_generated && test -z "$(git ls-files --others --exclude-standard -- openapi/normalized.json src/cztrading212/_generated)"
      - name: Build distributions twice
        shell: bash
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          uv build --out-dir dist
          uv build --out-dir dist-repro
          uv run python scripts/check_reproducible.py dist dist-repro
          uv run twine check --strict dist/*
      - name: Verify release artifacts
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: uv run python scripts/check_release.py --tag "$RELEASE_TAG" --dist dist
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
  publish:
    if: inputs.publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/cztrading212
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@v1.14.3
